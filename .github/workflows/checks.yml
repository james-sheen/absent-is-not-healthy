# The report builds from its source, its two case studies run on the released engine, and every commit carries
# the publication rules the family's repositories share.

name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The PDFs, from the source
        run: |
          set -euo pipefail
          python3 -m pip install --quiet virtualenv
          bash build.sh "$RUNNER_TEMP/pdf"
      - uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: ${{ runner.temp }}/pdf/*.pdf

  appendix:
    # Both case studies on the released engine, each held to the answers written before it ran; a scorer fails on
    # any departure. They take minutes, so they run on a tag and on demand.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The released engine
        run: python3 -m pip install --quiet 'arbiter-engine==0.2.39'
      - name: The air traffic controllers case
        working-directory: appendix-b/faa
        run: |
          set -euo pipefail
          python3 run_walks.py --out "$RUNNER_TEMP/faa"
          python3 score.py --results "$RUNNER_TEMP/faa/results.json"
      - name: The nursing homes case
        working-directory: appendix-b/nursing_homes
        run: |
          set -euo pipefail
          python3 run_walks.py --out "$RUNNER_TEMP/nursing_homes"
          python3 score.py "$RUNNER_TEMP/nursing_homes/results.json"

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The message and authorship steps read every commit a push carries; the default depth reads the tip.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The shared tools' own tests
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest
          python3 -m pytest tests/ -q

      - name: The publication vocabulary, over the tree
        run: python3 tools/hygiene_check.py --all

      - name: Commit messages
        # The commit-msg hook's backstop, and the reason this is not optional: a
        # message is the one published surface no later commit can correct.
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before || '' }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable base ref; checking HEAD only"
            LIST=$(git rev-parse HEAD)
          else
            LIST=$(git rev-list "$BASE..${{ github.sha }}")
            echo "checking $(echo "$LIST" | grep -c . ) commit message(s) in $BASE..${{ github.sha }}"
          fi
          FAILED=0
          for SHA in $LIST; do
            git log -1 --format=%B "$SHA" > /tmp/msg.txt
            echo "--- $SHA"
            python3 tools/commit_msg_check.py /tmp/msg.txt || FAILED=1
          done
          exit $FAILED

      - name: Authorship
        # A commit's author is neither its message nor a file in it, so neither
        # check above can see it. A local `user.email` quietly beat the global
        # one and a personal address reached 24 published commits. The hook
        # checks the setting before the commit; this checks the RESULT after it,
        # which is the thing that actually gets published.
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before || '' }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            LIST=$(git rev-parse HEAD)
          else
            LIST=$(git rev-list "$BASE..${{ github.sha }}")
          fi
          FAILED=0
          for SHA in $LIST; do
            for WHO in $(git log -1 --format='%ae%n%ce' "$SHA"); do
              case "$WHO" in
                *@users.noreply.github.com|*@noreply.github.com) ;;
                *) echo "::error::$SHA carries a real address in its authorship"; FAILED=1 ;;
              esac
            done
          done
          exit $FAILED
